name: fanconnact
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+2002

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  video_player: ^2.8.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.3
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  firebase_storage: ^12.4.10
  camera: ^0.12.0+2
  google_mlkit_selfie_segmentation: ^0.11.0
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  google_mobile_ads: ^9.0.0
  # twitter_login: ^4.4.2   # Twitter auth - remove `#` and add API keys when ready

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/fancoin/fanconnactlogo.png"
  adaptive_icon_background: "#02060C"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fancoin/
